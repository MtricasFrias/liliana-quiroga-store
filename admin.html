<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Liliana Quiroga Store</title>
<meta name="theme-color" content="#0A1712">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
</head>
<body>
<form id="gate" class="gate" hidden>
  <img src="assets/brand/cocodrilo-cabeza.svg" alt="Liliana Quiroga Store" width="120" height="120">
  <h1 id="gate-title">Ingresa tu PIN</h1>
  <p id="gate-hint"></p>
  <label for="pin" class="sr-only">PIN</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required>
  <button class="btn btn-brass btn-block">Entrar</button>
  <p class="gate-note">Vista previa: el acceso se valida en este navegador. Al pasar a producción se reemplaza por un inicio de sesión seguro.</p>
</form>

<div id="app" class="app" hidden>
  <aside class="side">
    <a href="#vender" class="side-crest"><img src="assets/brand/cocodrilo-laton.svg" alt="" width="120" height="45"><span>Panel de la boutique</span></a>
    <nav id="nav" aria-label="Panel"></nav>
    <div class="side-foot">
      <a href="index.html" target="_blank" rel="noopener">Ver la tienda</a>
      <button class="link" id="logout">Salir</button>
    </div>
  </aside>
  <main id="view" class="view"></main>
</div>
<dialog id="dlg" class="dlg"></dialog>
<dialog id="receipt" class="dlg receipt-dlg"></dialog>
<dialog id="scan" class="dlg scan-dlg"></dialog>
<script type="module" src="js/admin.js"></script>
</body>
</html>
