<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Liliana Quiroga Store</title>
<meta name="theme-color" content="#193B2E">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js" defer></script>
</head>
<body>
<form id="gate" class="gate" hidden>
  <img src="assets/brand/cocodrilo-claro.svg" alt="Liliana Quiroga Store" width="200" height="74">
  <h1 id="gate-title">Ingresa tu PIN</h1>
  <p id="gate-hint"></p>
  <label for="pin" class="sr-only">PIN</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required>
  <button class="btn btn-chalk btn-block">Entrar</button>
  <p class="gate-note">Vista previa: el acceso se valida en este navegador. En producción se reemplaza por un inicio de sesión seguro.</p>
</form>

<div id="app" class="app" hidden>
  <aside class="side">
    <a href="#venta" class="side-crest"><img src="assets/brand/cocodrilo-claro.svg" alt="" width="140" height="52"><span>Panel de la tienda</span></a>
    <nav id="nav" aria-label="Panel">
      <a href="#venta">Venta rápida</a>
      <a href="#inventario">Inventario</a>
      <a href="#caja">Caja</a>
      <a href="#finanzas">Finanzas</a>
      <a href="#etiquetas">Etiquetas</a>
      <a href="#ajustes">Ajustes</a>
    </nav>
    <div class="side-foot">
      <p id="demo-flag" class="side-demo" hidden>Datos de demostración</p>
      <a href="index.html" target="_blank" rel="noopener">Ver la tienda</a>
      <button class="link" id="logout">Salir</button>
    </div>
  </aside>
  <main id="view" class="view"></main>
</div>
<dialog id="dlg" class="dlg"></dialog>
<script type="module" src="js/admin.js"></script>
</body>
</html>
